<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LeafleKT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3.2.0/dist/style.min.css">

  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', Monaco, 'Cascadia Code', 'Consolas', monospace;
      --radius: 8px;
    }

    body, .markdown-section {
      font-family: var(--font-sans);
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      font-family: var(--font-sans);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .markdown-section h1 { font-size: 2rem; }
    .markdown-section h2 { font-size: 1.5rem; border-bottom: none; padding-bottom: 0; }
    .markdown-section h3 { font-size: 1.25rem; }
    .markdown-section h4 { font-size: 1.1rem; }

    .markdown-section p,
    .markdown-section li {
      line-height: 1.7;
    }

    .markdown-section code {
      font-family: var(--font-mono);
      font-size: 0.875em;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .markdown-section pre {
      border-radius: var(--radius);
      border: 1px solid var(--borderColor);
      padding: 16px 20px;
    }

    .markdown-section pre code {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.6;
      padding: 0;
      background: transparent;
      border: none;
    }

    .markdown-section table {
      border-collapse: separate;
      border-spacing: 0;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--borderColor);
    }

    .markdown-section th {
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      padding: 10px 16px;
    }

    .markdown-section td {
      padding: 8px 16px;
    }

    .markdown-section blockquote {
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 8px 16px;
    }

    .markdown-section hr {
      height: 1px;
      border: none;
      background: var(--borderColor);
      margin: 32px 0;
    }

    .sidebar {
      font-family: var(--font-sans);
    }

    .sidebar .sidebar-nav li {
      margin: 2px 0;
    }

    .sidebar .sidebar-nav a {
      font-size: 0.9rem;
      padding: 6px 16px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .sidebar .sidebar-nav a:hover {
      opacity: 0.8;
    }

    .sidebar .sidebar-nav a.active {
      font-weight: 600;
    }

    .sidebar ul li ul a {
      font-size: 0.82rem;
      padding: 4px 16px 4px 32px;
    }

    .search input {
      border-radius: 6px !important;
      font-family: var(--font-sans);
    }

  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    if (window.location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<h2>Cannot load from file://</h2>' +
        '<p>Run a local server:</p>' +
        '<pre>python3 -m http.server 3000 -d docs</pre>' +
        '<p>Then open <a href="http://localhost:3000">http://localhost:3000</a></p>'
    }
  </script>

  <script>
    window.$docsify = {
      name: 'LeafleKT',
      repo: 'binayshaw7777/LeafleKT-Maps',
      loadSidebar: true,
      auto2top: true,
      coverpage: false,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results',
      },
      darklightTheme: {
        siteFont: 'Inter',
        codeFontFamily: 'JetBrains Mono, SF Mono, Monaco, Consolas, monospace',
        bodyFontSize: '16px',
        defaultTheme: 'dark',
        dark: {
          accent: '#3b82f6',
          toogleBackground: '#ffffff',
          background: '#0a0a0a',
          textColor: '#fafafa',
          codeTextColor: '#e5e5e5',
          codeBackgroundColor: '#171717',
          borderColor: '#272727',
          blockQuoteColor: '#a3a3a3',
          highlightColor: '#3b82f6',
          sidebarSublink: '#a3a3a3',
          codeTypeColor: '#e5e5e5',
          coverBackground: 'linear-gradient(to left bottom, hsl(221, 83%, 53%) 0%,hsl(240, 6%, 10%) 100%)',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3.2.0/icons/sun.svg)'
        },
        light: {
          accent: '#2563eb',
          toogleBackground: '#0a0a0a',
          background: '#ffffff',
          textColor: '#171717',
          codeTextColor: '#171717',
          codeBackgroundColor: '#f5f5f5',
          borderColor: '#e5e5e5',
          blockQuoteColor: '#737373',
          highlightColor: '#2563eb',
          sidebarSublink: '#525252',
          codeTypeColor: '#171717',
          coverBackground: 'linear-gradient(to left bottom, hsl(221, 83%, 53%) 0%,hsl(220, 14%, 96%) 100%)',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3.2.0/icons/moon.svg)'
        }
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3.2.0/dist/index.min.js"></script>
</body>
</html>
